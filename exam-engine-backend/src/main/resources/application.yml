server:
  port: ${PORT:8080}
 
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
 
app:
  jwt:
    secret: ${JWT_SECRET:SecretKeyToGenerateJWTsSecretKeyToGenerateJWTsSecretKeyToGenerateJWTs}
    expiration-ms: 86400000 # 24 hours
  retry-lock-duration-days: 30
  override-lock-duration-days: 7
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      upload-dir: ${UPLOAD_DIR:uploads}
    s3:
      bucket-name: ${APP_S3_BUCKET:${AWS_S3_BUCKET:}}
      region: ${APP_S3_REGION:${AWS_REGION:}}
      access-key: ${APP_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
      secret-key: ${APP_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
      endpoint: ${APP_S3_ENDPOINT:${AWS_S3_ENDPOINT:}}
# ---- AI Question Generation (Groq / Grok / Gemini) ----
groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:groq/compound-mini}
 
grok:
  api:
    key: ${GROK_API_KEY:}
    url: ${GROK_API_URL:https://api.x.ai/v1/chat/completions}
    model: ${GROK_MODEL:grok-2-latest}
 
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}