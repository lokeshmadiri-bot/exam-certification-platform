server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:SecretKeyToGenerateJWTsSecretKeyToGenerateJWTsSecretKeyToGenerateJWTs}
    expiration-ms: 86400000 # 24 hours
  storage:
    provider: ${STORAGE_PROVIDER:local} # local or s3
    local:
      upload-dir: ${UPLOAD_DIR:uploads}
    s3:
      bucket-name: ${AWS_S3_BUCKET:oryfolks-certify-snapshots}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# ---- Gemini AI ----
# Set GEMINI_API_KEY env var to a valid Gemini API key (format: AIzaSy...).
# Without a valid key, AI question generation uses the backend local fallback
# (generic but structurally correct questions) instead of Gemini.
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
