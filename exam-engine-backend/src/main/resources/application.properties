# Server Port
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certify}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Servlet Upload Configurations
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Logging Configuration
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# App configurations
app.jwt.secret=${JWT_SECRET:SecretKeyToGenerateJWTsSecretKeyToGenerateJWTsSecretKeyToGenerateJWTs}
app.jwt.expiration-ms=86400000
app.retry-lock-duration-days=30
app.override-lock-duration-days=7
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.upload-dir=${UPLOAD_DIR:uploads}
app.storage.s3.bucket-name=${APP_S3_BUCKET:${AWS_S3_BUCKET:}}
app.storage.s3.region=${APP_S3_REGION:${AWS_REGION:}}
app.storage.s3.access-key=${APP_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
app.storage.s3.secret-key=${APP_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
app.storage.s3.endpoint=${APP_S3_ENDPOINT:${AWS_S3_ENDPOINT:}}

# Groq AI Configurations
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_MODEL:groq/compound-mini}

# Grok AI Configurations
grok.api.key=${GROK_API_KEY:}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}
grok.api.model=${GROK_MODEL:grok-2-latest}

# Gemini AI Configurations
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
